[package]
name = "reduct-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "ReductShell"
crate-type = ["cdylib"]

[dependencies]
reduct-common.workspace = true
windows-core.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    # CreateProcessW is gated on this feature (SECURITY_ATTRIBUTES).
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    # GetTickCount64, used in the list file name.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]
