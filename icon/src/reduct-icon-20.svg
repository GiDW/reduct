<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Hand-tuned 20 px version of the Reduct icon: no shadows, a 1 px gap between the tiles instead. -->
  <defs>
    <linearGradient id="back" x1="1" y1="1" x2="14" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9DDFD"/><stop offset="1" stop-color="#86BEF4"/>
    </linearGradient>
    <linearGradient id="front" x1="6" y1="6" x2="19" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3AA2F4"/><stop offset="1" stop-color="#0B5DB6"/>
    </linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
      <rect width="20" height="20" fill="#fff"/>
      <rect x="5" y="5" width="15" height="15" rx="4" fill="#000"/>
    </mask>
    <clipPath id="fc"><rect x="6" y="6" width="13" height="13" rx="3"/></clipPath>
  </defs>
  <rect x="1" y="1" width="13" height="13" rx="3" fill="url(#back)" mask="url(#gap)"/>
  <rect x="6" y="6" width="13" height="13" rx="3" fill="url(#front)"/>
  <g clip-path="url(#fc)" fill="#fff">
    <path d="M5.6 19.4 L10.6 13 L13.6 16.6 L15.2 15 L19.4 19.4 Z"/>
    <circle cx="15.9" cy="9.7" r="1.5"/>
  </g>
</svg>
