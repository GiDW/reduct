<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- back tile: the original, pale -->
    <linearGradient id="back" x1="32" y1="32" x2="184" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCEEFF"/>
      <stop offset="1" stop-color="#A3CEF8"/>
    </linearGradient>
    <!-- front tile: the result, solid -->
    <linearGradient id="front" x1="96" y1="96" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3EA6F6"/>
      <stop offset="1" stop-color="#0A5BB4"/>
    </linearGradient>
    <!-- top-edge highlight, as if lit from above -->
    <linearGradient id="rimFront" x1="0" y1="96" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimBack" x1="0" y1="32" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="peakFront" x1="0" y1="152" x2="0" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2F1FF"/>
    </linearGradient>
    <linearGradient id="peakBack" x1="0" y1="166" x2="0" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9D8FF"/>
      <stop offset="1" stop-color="#7DBCF5"/>
    </linearGradient>
    <clipPath id="frontClip"><rect x="96" y="96" width="128" height="128" rx="28"/></clipPath>
    <!-- layered shadow: ambient plus key light -->
    <filter id="shadowFront" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="a"/>
      <feOffset in="a" dy="1" result="a1"/>
      <feFlood flood-color="#0A2A55" flood-opacity="0.18"/><feComposite in2="a1" operator="in" result="amb"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="k"/>
      <feOffset in="k" dy="6" result="k1"/>
      <feFlood flood-color="#0A2A55" flood-opacity="0.26"/><feComposite in2="k1" operator="in" result="key"/>
      <feMerge><feMergeNode in="amb"/><feMergeNode in="key"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowBack" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="a"/>
      <feOffset in="a" dy="1" result="a1"/>
      <feFlood flood-color="#0A2A55" flood-opacity="0.12"/><feComposite in2="a1" operator="in" result="amb"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="k"/>
      <feOffset in="k" dy="3" result="k1"/>
      <feFlood flood-color="#0A2A55" flood-opacity="0.12"/><feComposite in2="k1" operator="in" result="key"/>
      <feMerge><feMergeNode in="amb"/><feMergeNode in="key"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- back tile -->
  <g filter="url(#shadowBack)">
    <rect x="32" y="32" width="152" height="152" rx="32" fill="url(#back)"/>
  </g>
  <rect x="33" y="33" width="150" height="150" rx="31" fill="none" stroke="url(#rimBack)" stroke-width="2"/>

  <!-- front tile -->
  <g filter="url(#shadowFront)">
    <rect x="96" y="96" width="128" height="128" rx="28" fill="url(#front)"/>
  </g>
  <g clip-path="url(#frontClip)">
    <!-- back peak -->
    <path d="M140 232 L178 176 Q184 167 190 176 L238 232 Z" fill="url(#peakBack)"/>
    <!-- front peak -->
    <path d="M84 232 L131 160 Q138 149 145 160 L196 232 Z" fill="url(#peakFront)"/>
    <!-- sun -->
    <circle cx="188" cy="132" r="13" fill="#FFFFFF"/>
  </g>
  <rect x="97" y="97" width="126" height="126" rx="27" fill="none" stroke="url(#rimFront)" stroke-width="2"/>
</svg>
