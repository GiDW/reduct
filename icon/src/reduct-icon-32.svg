<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Hand-tuned 32 px version of the Reduct icon: no shadows, a 1 px gap between the tiles instead. -->
  <defs>
    <linearGradient id="back" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9DDFD"/><stop offset="1" stop-color="#86BEF4"/>
    </linearGradient>
    <linearGradient id="front" x1="10" y1="10" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3AA2F4"/><stop offset="1" stop-color="#0B5DB6"/>
    </linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="9" y="9" width="22" height="22" rx="5.5" fill="#000"/>
    </mask>
    <clipPath id="fc"><rect x="10" y="10" width="20" height="20" rx="4.5"/></clipPath>
  </defs>
  <rect x="2" y="2" width="20" height="20" rx="4.5" fill="url(#back)" mask="url(#gap)"/>
  <rect x="10" y="10" width="20" height="20" rx="4.5" fill="url(#front)"/>
  <g clip-path="url(#fc)" fill="#fff">
    <path d="M9.5 30.5 L16.6 21 L21 26.4 L23.6 23.8 L30.5 30.5 Z"/>
    <circle cx="25" cy="15.4" r="2.4"/>
  </g>
</svg>
