<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Hand-tuned 24 px version of the Reduct icon: no shadows, a 1 px gap between the tiles instead. -->
  <defs>
    <linearGradient id="back" x1="2" y1="2" x2="17" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9DDFD"/><stop offset="1" stop-color="#86BEF4"/>
    </linearGradient>
    <linearGradient id="front" x1="7" y1="7" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3AA2F4"/><stop offset="1" stop-color="#0B5DB6"/>
    </linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <rect x="6" y="6" width="17" height="17" rx="4.5" fill="#000"/>
    </mask>
    <clipPath id="fc"><rect x="7" y="7" width="15" height="15" rx="3.5"/></clipPath>
  </defs>
  <rect x="2" y="2" width="15" height="15" rx="3.5" fill="url(#back)" mask="url(#gap)"/>
  <rect x="7" y="7" width="15" height="15" rx="3.5" fill="url(#front)"/>
  <g clip-path="url(#fc)" fill="#fff">
    <path d="M6.6 22.4 L12.2 15.4 L15.6 19.4 L17.6 17.4 L22.4 22.4 Z"/>
    <circle cx="18.6" cy="11.4" r="1.8"/>
  </g>
</svg>
