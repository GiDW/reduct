name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest,  target: x86_64-pc-windows-msvc,  arch: x64 }
          - { runner: windows-11-arm,  target: aarch64-pc-windows-msvc, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}", components: rustfmt }
      - uses: ilammy/setup-nasm@v1
        if: matrix.arch == 'x64'
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      # Formatting is the same on both architectures: check it once.
      - run: cargo fmt --all --check
        if: matrix.arch == 'x64'
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Batch smoke test
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke'
          Remove-Item -Recurse -Force $smoke -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $smoke | Out-Null
          Copy-Item fixtures/orientation/*.jpg $smoke
          Copy-Item fixtures/colour/half-transparent-8x8.png (Join-Path $smoke 'sample.png')
          # broken.jpg: the first 200 bytes of Landscape_1.jpg, cut inside the
          # quantisation tables. A cut inside the scan data (which starts at
          # byte 482) still decodes: WIC fills the missing rows.
          $landscape = [IO.File]::ReadAllBytes((Join-Path $smoke 'Landscape_1.jpg'))
          [IO.File]::WriteAllBytes((Join-Path $smoke 'broken.jpg'), [byte[]]$landscape[0..199])

          # --no-window: a batch with errors keeps the progress window open
          # until someone closes it, which would hang the job.
          # Deterministic settings: never skip an output as larger.
          $data = Join-Path $env:LOCALAPPDATA 'Reduct'
          New-Item -ItemType Directory -Force $data | Out-Null
          Remove-Item -Recurse -Force (Join-Path $data 'logs') -ErrorAction SilentlyContinue
          Set-Content -Path (Join-Path $data 'settings.ini') -Value 'skip_if_larger=false' -Encoding utf8NoBOM

          $list = Join-Path $env:RUNNER_TEMP 'smoke-list.txt'
          $paths = Get-ChildItem $smoke -File | ForEach-Object { $_.FullName }
          [IO.File]::WriteAllText($list, (($paths -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))

          $exe = "target\$env:TARGET\release\Reduct.exe"
          $proc = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList '--batch', "`"$list`"", '--no-window'
          Write-Host "Reduct.exe exit code: $($proc.ExitCode)"
          Get-ChildItem $smoke | Format-Table Name, Length -AutoSize | Out-String | Write-Host

          $errors = @()
          if ($proc.ExitCode -ne 1) { $errors += "expected exit code 1, got $($proc.ExitCode)" }
          $expected = @(1..8 | ForEach-Object { "Landscape_${_}_2.jpg" }) + 'sample.jpg'
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path $smoke $name))) { $errors += "missing output $name" }
          }
          $tmp = @(Get-ChildItem $smoke -Filter '*.tmp-*')
          if ($tmp.Count -gt 0) { $errors += "temp files left: $($tmp.Name -join ', ')" }
          if (Test-Path $list) { $errors += 'list file was not deleted' }
          $logs = @(Get-ChildItem (Join-Path $data 'logs') -Filter 'failures-*.txt' -ErrorAction SilentlyContinue)
          foreach ($log in $logs) { Write-Host "--- $($log.Name)"; Get-Content $log.FullName | Write-Host }
          if (-not ($logs | Where-Object { (Get-Content $_.FullName -Raw) -match 'broken\.jpg' })) {
            $errors += 'no failures log mentions broken.jpg'
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'Smoke test passed'
      - name: Check the Reduct.exe resources
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Res {
              [DllImport("kernel32", SetLastError = true, CharSet = CharSet.Unicode)]
              static extern IntPtr LoadLibraryExW(string path, IntPtr file, uint flags);
              [DllImport("kernel32", SetLastError = true)]
              static extern IntPtr FindResourceW(IntPtr module, IntPtr name, IntPtr type);
              [DllImport("kernel32", SetLastError = true)]
              static extern IntPtr LoadResource(IntPtr module, IntPtr info);
              [DllImport("kernel32")]
              static extern IntPtr LockResource(IntPtr data);
              [DllImport("kernel32")]
              static extern uint SizeofResource(IntPtr module, IntPtr info);
              // LOAD_LIBRARY_AS_DATAFILE | LOAD_LIBRARY_AS_IMAGE_RESOURCE
              public static IntPtr Open(string path) { return LoadLibraryExW(path, IntPtr.Zero, 0x22); }
              public static byte[] Get(IntPtr module, int type, int name) {
                  IntPtr info = FindResourceW(module, (IntPtr)name, (IntPtr)type);
                  if (info == IntPtr.Zero) return null;
                  uint size = SizeofResource(module, info);
                  byte[] bytes = new byte[size];
                  Marshal.Copy(LockResource(LoadResource(module, info)), bytes, 0, (int)size);
                  return bytes;
              }
          }
          '@
          $exe = (Resolve-Path "target\$env:TARGET\release\Reduct.exe").Path
          $module = [Res]::Open($exe)
          if ($module -eq [IntPtr]::Zero) { Write-Host '::error::could not load Reduct.exe as a data file'; exit 1 }
          $errors = @()
          # RT_GROUP_ICON 14, RT_DIALOG 5, RT_VERSION 16, RT_MANIFEST 24
          foreach ($r in @(@{ Type = 14; Name = 1; What = 'icon IDI_APP' }, @{ Type = 5; Name = 101; What = 'dialog IDD_SETTINGS' }, @{ Type = 5; Name = 102; What = 'dialog IDD_PROGRESS' },
                          @{ Type = 16; Name = 1; What = 'VS_VERSION_INFO' }, @{ Type = 24; Name = 1; What = 'manifest 1' })) {
            $bytes = [Res]::Get($module, $r.Type, $r.Name)
            if ($bytes) { Write-Host "$($r.What): $($bytes.Length) bytes" } else { $errors += "Reduct.exe has no $($r.What)" }
          }
          $manifest = [Res]::Get($module, 24, 1)
          if ($manifest) {
            $text = [Text.Encoding]::UTF8.GetString($manifest)
            Write-Host $text
            foreach ($needle in 'Microsoft.Windows.Common-Controls', 'PerMonitorV2', '<activeCodePage', '8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a') {
              if (-not $text.Contains($needle)) { $errors += "manifest lacks $needle" }
            }
          }
          $cargo = Get-Content Cargo.toml -Raw
          $null = $cargo -match '(?ms)^\[workspace\.package\][^\[]*?^version\s*=\s*"(\d+\.\d+\.\d+)"'
          $version = "$($Matches[1]).0"
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List FileVersion, ProductVersion, CompanyName, ProductName, FileDescription, LegalCopyright | Out-String | Write-Host
          if ($info.FileVersion -ne $version) { $errors += "FileVersion is '$($info.FileVersion)', expected $version" }
          if ($info.ProductVersion -ne $version) { $errors += "ProductVersion is '$($info.ProductVersion)', expected $version" }
          if ($info.CompanyName -ne 'Oxyde') { $errors += "CompanyName is '$($info.CompanyName)'" }
          if ($info.ProductName -ne 'Reduct') { $errors += "ProductName is '$($info.ProductName)'" }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'Resources OK'
      - name: Check ReductShell.dll exports
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { Write-Host '::error::dumpbin.exe not found'; exit 1 }
          Write-Host "dumpbin: $dumpbin"
          $exports = & $dumpbin /nologo /exports "target\$env:TARGET\release\ReductShell.dll" | Out-String
          Write-Host $exports
          $missing = @('DllGetClassObject', 'DllCanUnloadNow') | Where-Object { -not ($exports | Select-String -SimpleMatch $_ -Quiet) }
          if ($missing) { $missing | ForEach-Object { Write-Host "::error::ReductShell.dll does not export $_" }; exit 1 }
          Write-Host 'Exports OK'
      - name: Check the C runtime is linked statically
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { Write-Host '::error::dumpbin.exe not found'; exit 1 }
          $bad = @()
          foreach ($bin in 'Reduct.exe', 'ReductShell.dll') {
            $out = & $dumpbin /nologo /dependents "target\$env:TARGET\release\$bin"
            $deps = @($out | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() })
            Write-Host "$bin dependents: $($deps -join ', ')"
            $bad += $deps | Where-Object { $_ -match '^(vcruntime\d+|msvcp\d+|ucrtbase|api-ms-win-crt-)' } | ForEach-Object { "$bin imports $_" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'C runtime is static'
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/Reduct.exe
            target/${{ matrix.target }}/release/Reduct.pdb
            target/${{ matrix.target }}/release/ReductShell.dll
            target/${{ matrix.target }}/release/ReductShell.pdb
      # Cargo.lock procedure: test and build run with --locked, so adding a
      # dependency makes the first run fail. These two x64 steps always run
      # afterwards: `cargo update --workspace` adds the missing entries to the
      # committed lock file (existing pins stay, nothing else is upgraded) and
      # the result is uploaded as the `cargo-lock` artifact. Fetch it with
      # `gh run download <id> -n cargo-lock -D /tmp/lock`, copy it to the repo
      # root, commit and push; the next run is green under --locked.
      - name: Resolve Cargo.lock
        if: always() && matrix.arch == 'x64'
        run: cargo update --workspace
      - uses: actions/upload-artifact@v7
        if: always() && matrix.arch == 'x64'
        with: { name: cargo-lock, path: Cargo.lock }

  package:
    # Packages only what lands on main or a tag; PRs stop after `build`.
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: bin-x64, path: bin/x64 }
      - uses: actions/download-artifact@v8
        with: { name: bin-arm64, path: bin/arm64 }
      # package/priconfig.xml is `makepri createconfig /cf priconfig.xml /dq en-US
      # /pv 10.0.0` without its <packaging> element: no per-scale resource PRIs,
      # so one resources.pri holds every candidate. This step flags SDK drift.
      - name: Check priconfig.xml against makepri createconfig
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $makepri = Get-ChildItem $kits -Directory -Filter '10.*' |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64\makepri.exe') } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName 'x64\makepri.exe' }
          $fresh = Join-Path $env:RUNNER_TEMP 'priconfig.xml'
          & $makepri createconfig /cf $fresh /dq en-US /pv 10.0.0 /o | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::makepri createconfig failed"; exit 1 }
          $skip = $false
          $expected = Get-Content $fresh | Where-Object {
            if ($_ -match '<packaging>') { $skip = $true }
            $keep = -not $skip
            if ($_ -match '</packaging>') { $skip = $false }
            $keep
          }
          $diff = Compare-Object (Get-Content package/priconfig.xml) $expected -SyncWindow 0
          if ($diff) {
            Write-Host '--- makepri createconfig output:'
            Get-Content $fresh | Write-Host
            Write-Host '::warning::package/priconfig.xml differs from makepri createconfig output (minus <packaging>)'
          } else { Write-Host 'priconfig.xml matches makepri createconfig (minus <packaging>)' }
      - name: Create the test signing certificate
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [byte[]]::new(24)
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $pw = [Convert]::ToBase64String($bytes)
          Write-Host "::add-mask::$pw"
          "password=$pw" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=7218F926-DACB-453E-B8D1-DB1C47916A85' `
            -KeyUsage DigitalSignature -FriendlyName 'Reduct test signing' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') `
            -CertStoreLocation Cert:\CurrentUser\My
          $secure = ConvertTo-SecureString $pw -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath (Join-Path $env:RUNNER_TEMP 'reduct-test.pfx') -Password $secure | Out-Null
          New-Item -ItemType Directory -Force out/sideload | Out-Null
          Export-Certificate -Cert $cert -FilePath out/sideload/reduct-test.cer | Out-Null
          Write-Host "Test certificate: $($cert.Thumbprint)"
      - name: Package
        id: package
        shell: pwsh
        env:
          SIGN_PASSWORD: ${{ steps.cert.outputs.password }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?ms)^\[workspace\.package\][^\[]*?^version\s*=\s*"(\d+\.\d+\.\d+)"') {
            Write-Host '::error::no version in [workspace.package]'; exit 1
          }
          $version = "$($Matches[1]).0"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          ./scripts/package.ps1 -Version $version -BinRoot bin -Out out/build `
            -SignPfx (Join-Path $env:RUNNER_TEMP 'reduct-test.pfx') -SignPassword $env:SIGN_PASSWORD

          Copy-Item "out/build/Reduct_$version.msixbundle" out/sideload
          New-Item -ItemType Directory -Force out/store | Out-Null
          Copy-Item "out/build/Reduct_$version.msixupload" out/store
          @(
            "Reduct ${version}: test-signed sideload build"
            ''
            'This bundle is signed with a throwaway test certificate made by CI.'
            'Install it on Windows 11 (x64 or ARM64):'
            ''
            '1. In an elevated PowerShell (Run as administrator), trust the test certificate:'
            '   Import-Certificate .\reduct-test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople'
            '2. Install the bundle:'
            "   Add-AppxPackage .\Reduct_$version.msixbundle"
            '3. Restart Explorer so the context-menu entry appears:'
            '   Stop-Process -Name explorer -Force   (Explorer restarts by itself)'
            ''
            'Uninstall: Get-AppxPackage Oxyde.Reduct | Remove-AppxPackage'
          ) | Set-Content out/sideload/INSTALL.txt -Encoding utf8
          Get-ChildItem out/sideload, out/store | Format-Table Directory, Name, Length -AutoSize | Out-String | Write-Host
      - name: Inspect the packages
        shell: pwsh
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Show-Zip($path) {
            Write-Host "--- $path"
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $path))
            try { $zip.Entries | ForEach-Object { Write-Host "  $($_.FullName)  $($_.Length)" } } finally { $zip.Dispose() }
          }
          Show-Zip "out/build/Reduct_${env:VERSION}_x64.msix"
          Show-Zip "out/build/Reduct_${env:VERSION}.msixbundle"
          Show-Zip "out/build/Reduct_${env:VERSION}.msixupload"
          $sig = Get-AuthenticodeSignature "out/sideload/Reduct_${env:VERSION}.msixbundle"
          Write-Host "Sideload bundle signer: $($sig.SignerCertificate.Subject) ($($sig.Status))"
          if ($sig.SignerCertificate.Subject -ne 'CN=7218F926-DACB-453E-B8D1-DB1C47916A85') {
            Write-Host '::error::sideload bundle is not signed with the test certificate'; exit 1
          }
      # Optional install check (not part of the v1 test scope): continue-on-error
      # so a runner without AppX deployment support does not block the artifacts.
      - name: Try installing the signed bundle
        continue-on-error: true
        shell: pwsh
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "OS: $([Environment]::OSVersion.VersionString)"
          Import-Certificate out/sideload/reduct-test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage "out/sideload/Reduct_${env:VERSION}.msixbundle"
          $pkg = Get-AppxPackage Oxyde.Reduct
          if (-not $pkg) { throw 'Oxyde.Reduct is not installed' }
          $pkg | Format-List Name, Version, Architecture, PublisherId, InstallLocation | Out-String | Write-Host
          Remove-AppxPackage $pkg.PackageFullName
          Write-Host 'Install test passed'
      - uses: actions/upload-artifact@v7
        with:
          name: reduct-sideload
          if-no-files-found: error
          path: out/sideload/
      - uses: actions/upload-artifact@v7
        with:
          name: reduct-store
          if-no-files-found: error
          path: out/store/

  release:
    # Tags v* only: attaches the Store upload to a GitHub Release for
    # transparency (spec §7.5). It is unsigned until the Store signs it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the workspace version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(awk '/^\[workspace\.package\]/{p=1; next} /^\[/{p=0} p && /^version *=/{gsub(/.*= *"|".*/, ""); print; exit}' Cargo.toml)
          if [ -z "$version" ]; then echo "::error::no version in [workspace.package]"; exit 1; fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version (expected v$version)"; exit 1
          fi
          echo "package=$version.0" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with: { name: reduct-store, path: store }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: store/Reduct_${{ steps.version.outputs.package }}.msixupload
          fail_on_unmatched_files: true
