name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest,  target: x86_64-pc-windows-msvc,  arch: x64 }
          - { runner: windows-11-arm,  target: aarch64-pc-windows-msvc, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: ilammy/setup-nasm@v1
        if: matrix.arch == 'x64'
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      # Cargo.lock procedure: test and build run with --locked, so adding a
      # dependency makes the first run fail. These two x64 steps always run
      # afterwards: `cargo update --workspace` adds the missing entries to the
      # committed lock file (existing pins stay, nothing else is upgraded) and
      # the result is uploaded as the `cargo-lock` artifact. Fetch it with
      # `gh run download <id> -n cargo-lock -D /tmp/lock`, copy it to the repo
      # root, commit and push; the next run is green under --locked.
      - name: Resolve Cargo.lock
        if: always() && matrix.arch == 'x64'
        run: cargo update --workspace
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'x64'
        with: { name: cargo-lock, path: Cargo.lock }
